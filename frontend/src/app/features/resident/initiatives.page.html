<div class="page">
  <h1>Moje inicjatywy</h1>
  <p class="lead">Co się dzieje z tym, czym się zajęłaś lub zająłeś.</p>

  <div class="chip-row">
    @for (f of filters; track f.id) {
      <button [class.on]="filter() === f.id" (click)="filter.set(f.id)">{{ f.label }}</button>
    }
  </div>

  <div class="list">
    @for (s of items(); track s.id) {
      <app-initiative-card [stop]="s" (opened)="showOnMap(s.id)" />
    } @empty {
      <p class="empty">Nic tu jeszcze nie ma. Wejdź na mapę, zagłosuj albo zgłoś własny problem.</p>
    }
  </div>
</div>
