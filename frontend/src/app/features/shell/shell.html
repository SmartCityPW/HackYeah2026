<main>
  <router-outlet />
</main>
<app-navbar [items]="navItems()" />

@if (devTools) {
<div class="dev-role" title="Tryb deweloperski: przełącznik widoku">
  @if (roleSwitchable()) {
    @for (r of roles; track r.role) {
      <button [class.on]="role() === r.role" (click)="switchRole(r.role)">{{ r.label }}</button>
    }
  }
  <button [class.on]="gpsSimulated()" (click)="toggleSimulatedGps()" title="Symuluj pozycję GPS">📍 GPS</button>
</div>
}

@if (toast.message(); as text) {
  <div class="toast" role="status">🎁 {{ text }}</div>
}
