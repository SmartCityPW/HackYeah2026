# Szablon nginx (obraz podstawia ${FRONTEND_CONFIG} przy starcie). Serwer statycznych plików aplikacji Angular (PWA/SPA): każda nieznana ścieżka wraca do index.html, a router kątowy ją obsługuje.
# Schemat połączenia klienta: gdy przed nginx stoi proxy z TLS (Caddy), przekazuje on X-Forwarded-Proto; bez niego bierzemy własny.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Moduł workera MapLibre (.mjs) musi mieć typ JavaScript, inaczej przeglądarka go odrzuci i mapa się nie uruchomi.
    include /etc/nginx/mime.types;
    types {
        text/javascript mjs;
        application/yaml yaml;
        model/gltf-binary glb;
        model/gltf+json gltf;
        application/manifest+json webmanifest;
    }

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json text/yaml application/yaml model/gltf-binary image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;

    # API: ten sam adres co aplikacja, więc bez CORS i bez wpisywania domeny we froncie. Backend działa w sieci Dockera (usługa `backend`).
    location ^~ /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 35s;
        client_max_body_size 1m;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff always;
    }

    # Pliki z hashem w nazwie nigdy się nie zmieniają, więc przeglądarka może je trzymać rok.
    location ~ "^/(chunk|main|polyfills|styles)-[A-Za-z0-9_-]+\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Konfiguracja i punkt wejścia: zawsze świeże (zmiana adresu backendu ma działać od razu po odświeżeniu).
    location = /config/app-config.yaml {
        # ${FRONTEND_CONFIG} podstawia nginx w obrazie przy starcie (docker/templates): plik wskazany zmienną FRONTEND_CONFIG.
        alias /usr/share/nginx/html/config/${FRONTEND_CONFIG};
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff always;
    }
    # Service worker i jego manifest zmian muszą być zawsze świeże, inaczej aktualizacje aplikacji nie dotrą do użytkowników.
    location ~ "^/(ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js|manifest\.webmanifest)$" {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }

    # Brak pliku z rozszerzeniem to 404 (a nie index.html), żeby brakujący model czy skrypt nie wyglądał jak "działa".
    location ~* "\.(js|mjs|css|glb|gltf|png|jpe?g|svg|ico|webp|woff2?|json|webmanifest|yaml|map|txt)$" {
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ /index.html;
    }
}
