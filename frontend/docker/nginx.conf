# Serwer statycznych plików aplikacji Angular (PWA/SPA): każda nieznana ścieżka wraca do index.html, a router kątowy ją obsługuje.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Moduł workera MapLibre (.mjs) musi mieć typ JavaScript, inaczej przeglądarka go odrzuci i mapa się nie uruchomi.
    include /etc/nginx/mime.types;
    types {
        text/javascript mjs;
        application/yaml yaml;
        model/gltf-binary glb;
        model/gltf+json gltf;
    }

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json text/yaml application/yaml model/gltf-binary image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;

    # Pliki z hashem w nazwie nigdy się nie zmieniają, więc przeglądarka może je trzymać rok.
    location ~ "^/(chunk|main|polyfills|styles)-[A-Za-z0-9_-]+\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Konfiguracja i punkt wejścia: zawsze świeże (zmiana adresu backendu ma działać od razu po odświeżeniu).
    location = /config/app-config.yaml {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }

    # Brak pliku z rozszerzeniem to 404 (a nie index.html), żeby brakujący model czy skrypt nie wyglądał jak "działa".
    location ~* "\.(js|mjs|css|glb|gltf|png|jpe?g|svg|ico|webp|woff2?|json|yaml|map|txt)$" {
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ /index.html;
    }
}
