# Konfiguracja aplikacji ładowana przy starcie (zob. src/app/core/config/).
# Tu leżą wszystkie wartości zmienne frontendu. Zmiana wymaga tylko edycji tego pliku (bez przebudowy kodu),
# a w środowisku produkcyjnym wystarczy podmienić plik przy wdrożeniu. SEKRETÓW tu nie ma.

api:
  baseUrl: http://localhost:8000/api/v1   # adres backendu (patrz backend/config/default.yaml: server, app.api_prefix)
  # Źródło danych per obszar. Sposób przechodzenia z atrap na backend: docs/frontend-adaptation.md
  #   mock = dane w pamięci (src/app/core/api/*.mock.ts), http = prawdziwy backend
  mode:
    pokestops: mock
    game: mock
    account: mock      # konto, logowanie, organizacje (mock = rola wybierana ręcznie przełącznikiem deweloperskim)
    scenarios: mock    # katalog scenariuszy zgłoszeń (mock = zaszyty w kodzie, http = GET /scenarios)
    catalog: mock      # słownik postaci (mock = catalog.mock.json wygenerowany z backend/config/seed/reference.yaml, http = GET /catalog)

auth:
  storageKeyPrefix: scgo                  # klucze w localStorage: <prefix>.role, <prefix>.access, <prefix>.refresh
  autoGuest: true                         # tryb http: bez tokenu zakładamy konto gościa (POST /auth/guest)
  passwordMinLength: 8                    # tak samo jak backend (auth.password_min_length); tylko do podpowiedzi w formularzu, decyduje serwer

map:
  styleUrl: https://tiles.openfreemap.org/styles/liberty
  workerUrl: /maplibre/maplibre-gl-worker.mjs   # plik kopiowany przez angular.json (assets)
  center: { lat: 50.0617, lng: 19.9373 }        # domyślny widok i środek wyszukiwania przeciwników (Rynek, Kraków)
  zoom: 16.3
  pitch: 55
  bearing: -15

game:
  interactionRangeM: 50                   # promień kółka interakcji (głos, nowa pinezka, walka); tylko do wyświetlania, decyduje backend
  maxTeamSize: 3                          # ilu pokemonów do jednej walki (backend: game.max_party_size)
  typeMultiplier: 1.2                     # podgląd mnożnika typu (backend: game.same_type_multiplier), wynik walki liczy backend
  actionDwellSeconds: 20                  # "akcja na miejscu": tyle sekund w kółku przy przeciwniku przed wyborem drużyny
  leaveGraceSeconds: 5                    # tyle sekund na powrót do kółka w trakcie walki, potem walka się przerywa
  encounterRefreshMeters: 10              # po tylu metrach ruchu pytamy o przeciwników na nowo
  encounterRefreshSeconds: 30             # odświeżanie przeciwników także na postoju
  battleClashMs: 1600                     # najkrótszy czas animacji starcia
  simulatedGps: { lat: 50.0617, lng: 19.9373 }  # pozycja z przycisku "GPS" (narzędzia deweloperskie)

upload:
  enabled: true                          # false ukrywa pola zdjęć (tryb http, dopóki backend nie ma POST /photos: dziś 501)
  maxPhotos: 3
  maxPhotoBytes: 5242880                  # 5 MB (zgodnie z backendem: pokestops.photos.max_bytes)

ui:
  toastMs: 3000
  commentsPageSize: 10                    # komentarze nadrzędne na stronę
  mapReloadDebounceMs: 400                # po ilu ms od zatrzymania mapy dociągamy pinezki z widocznego obszaru

dev:
  tools: true                             # przełącznik ról i symulator GPS; w produkcji ustaw false
