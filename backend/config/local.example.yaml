# Praca lokalna bez Dockera: skopiuj do config/local.yaml (plik jest w .gitignore) i uruchom z
#   APP_CONFIG_OVERRIDE=config/local.yaml
# SQLite zamiast PostgreSQL, tryb debug, scenariusze i słowniki ładowane przy starcie (manage.py bootstrap).
app:
  debug: true
database:
  engine: sqlite
  name: data/dev.sqlite3      # liczone od katalogu backend/
seed:
  on_start: true
location:
  allow_simulated: true      # lokalnie: tryb deweloperski frontendu (symulowany GPS) wysyła pozycję ze źródłem "simulated"

# Moderacja z prawdziwym agentem (Google Gemini): odkomentuj, ustaw AI_API_KEY w środowisku i sprawdź:
#   .venv/bin/python manage.py moderation_check
