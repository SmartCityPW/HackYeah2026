# Dane demonstracyjne (tylko tryb debug): konta i pinezki wokół TAURON Areny Kraków (miejsce HackYeah, domyślny widok mapy).
# Hasło wszystkich kont demo pochodzi ze zmiennej środowiskowej DEMO_PASSWORD (nie ma go w repozytorium).
users:
  - {email: admin@demo.smartcity.example,     name: Administrator,           role: admin}
  - {email: fundacja@demo.smartcity.example,  name: Fundacja Zielone Miasto, role: org, organization: {name: Fundacja Zielone Miasto, kind: foundation, contact_person: Anna Kowalska, contact_email: kontakt@zielonemiasto.example}}
  - {email: kasia@demo.smartcity.example,     name: Kasia,                   role: resident}
  - {email: michal@demo.smartcity.example,    name: Michał,                  role: resident}
  - {email: ola@demo.smartcity.example,       name: Ola,                     role: resident}
  - {email: kuba@demo.smartcity.example,      name: Kuba,                    role: resident}
  - {email: marta@demo.smartcity.example,     name: Marta,                   role: resident}
  # Konto do logowania w pokazie i testach ręcznych: "w połowie gry" (poziom 7, kilkanaście Spryciaków na różnych poziomach).
  - email: tester@demo.smartcity.example
    name: Zosia
    role: resident
    xp: 640
    pokemons:   # oprócz startowego; exp decyduje o poziomie (100 exp na poziom)
      - {character: car,             exp: 480}
      - {character: small_car,       exp: 410}
      - {character: suv,             exp: 350}
      - {character: sports_car,      exp: 300}
      - {character: van,             exp: 260}
      - {character: trash_can,       exp: 210}
      - {character: dumpster,        exp: 170}
      - {character: tree,            exp: 130}
      - {character: potted_tree,     exp: 90}
      - {character: flower_pot,      exp: 50}
      - {character: air_conditioner, exp: 20}
    starter_exp: 620

# Każdy mieszkaniec ma pokemona startowego, więc zgłoszenia problemów mają różnych autorów.
pokestops:
  - {author: kasia@demo.smartcity.example,  scenario: res-pothole, title: Dziura na przejściu dla pieszych, description: Wyrwa w asfalcie tuż przy krawężniku przy wyjściu z tramwaju., lat: 50.0669, lng: 19.9905}
  - {author: michal@demo.smartcity.example, scenario: res-bin,     title: Przepełnione kosze po wydarzeniach, description: Po koncertach kosze przy przystanku są pełne, a śmieci rozwiewa wiatr., lat: 50.06835, lng: 19.99305}
  - {author: ola@demo.smartcity.example,    scenario: res-lamp,    title: Nie świecą latarnie na parkingu, description: Na części parkingu od strony ulicy wieczorem jest całkiem ciemno., lat: 50.0659, lng: 19.9925}
  - author: kuba@demo.smartcity.example
    scenario: place-fun
    title: Boisko do kosza za Areną
    description: Ogólnodostępne boisko z dobrymi koszami i oświetleniem.
    lat: 50.0688
    lng: 19.9945
    details: {rating: "5", cost: free, vibes: [friends], bestTime: [afternoon, evening], activity: court}
  - author: marta@demo.smartcity.example
    scenario: place-food
    title: Food trucki przy wejściu
    description: W dni wydarzeń stoi tu kilka food trucków, jest też opcja wege.
    lat: 50.0679
    lng: 19.9910
    details: {rating: "4", cost: cheap, vibes: [friends], offer: streetfood, vegan: true}
  - author: fundacja@demo.smartcity.example
    scenario: org-tree
    title: Szpaler lip wzdłuż ulicy Lema
    description: Proponujemy posadzenie 20 lip wzdłuż chodnika prowadzącego do Areny. Co o tym myślisz?
    lat: 50.0690
    lng: 19.9896
    character: tree
    details: {plantingType: new, species: linden, count: 20, rationale: Cień i mniej hałasu przy drodze do Areny, contactPerson: Anna Kowalska, contactEmail: kontakt@zielonemiasto.example}
