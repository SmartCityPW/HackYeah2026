# Dane demo w Dockerze: w .env ustaw  APP_CONFIG_OVERRIDE=config/demo.example.yaml  (albo skopiuj ten plik do config/demo.yaml
# i wskaż jego), a także DEMO_PASSWORD. Przy każdym starcie backendu `bootstrap` doładuje konta i pinezki demo (idempotentnie).
# Tryb debug jest wymagany przez `manage.py seed_demo`; na produkcji tego nie używaj.
app:
  debug: true
seed:
  demo_on_start: true
location:
  allow_simulated: true   # demo: przycisk GPS (tryby deweloperskie frontendu) wysyła pozycję symulowaną
  # max_accuracy_m: 500   # odkomentuj, jeśli pokazujesz na komputerze z prawdziwą lokalizacją z Wi-Fi (dokładność zwykle 100-1000 m)
