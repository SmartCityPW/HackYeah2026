openapi: 3.0.3
info:
  title: Smart City Go API
  version: 0.1.0
  description: |
    Kontrakt między frontendem (Angular PWA) a backendem (Django).

    Zasady:
    * **Serwer jest źródłem prawdy.** Klient nie liczy nagród, wyników walk ani XP, tylko wysyła intencję i wyświetla odpowiedź.
    * Pola JSON w **camelCase**, daty w ISO 8601 (UTC), współrzędne jako `lat` i `lng` (stopnie, WGS84).
    * Autoryzacja: `Authorization: Bearer <access token>` (JWT). Konto gościa powstaje jednym wywołaniem bez danych.
    * Błędy mają jednolity kształt `Error`. Błędy walidacji formularzy (422) wskazują pola w `fields`.
    * Identyfikatory to liczby całkowite. Postacie i scenariusze identyfikują stabilne kody tekstowe (`code`).
    * **Kółko interakcji (jak w Pokémon GO):** głosować, dodawać pinezki i walczyć można tylko w promieniu **50 m** od
      pozycji gracza (komentować można z dowolnego miejsca). Akcje wysyłają `position` (`PositionRequest`), serwer liczy
      odległość sam i poza kółkiem odpowiada `422` z kodem `too_far` (`TooFarError`: `distanceM`, `radiusM`). Promień
      to wartość konfiguracji backendu; klient rysuje go na mapie tylko informacyjnie.
servers:
  - url: http://localhost:8000/api/v1
    description: Lokalny backend deweloperski
tags:
  - { name: auth, description: Konta i tokeny }
  - { name: scenarios, description: 'Katalog formularzy zgłoszeń i słowniki gry' }
  - { name: pokestops, description: 'Pinezki, głosy, komentarze, zdjęcia' }
  - { name: me, description: Dane zalogowanego użytkownika }
  - { name: game, description: 'Przeciwnicy, walki, postęp' }
  - { name: events, description: 'Wydarzenia organizacji i samorządu (udział nagradzany unikalnym pokemonem)' }
  - { name: organizations, description: 'Dane organizacji' }
  - { name: admin, description: 'Moderacja i zarządzanie (rola administratora)' }
security:
  - bearerAuth: []

paths:
  /auth/guest:
    post:
      tags: [auth]
      summary: Utwórz anonimowe konto gościa
      description: Pozwala zacząć grę bez rejestracji. Postęp można później zapisać przez `/auth/upgrade`.
      security: []
      responses:
        '201': { description: Konto gościa, content: { application/json: { schema: { $ref: '#/components/schemas/AuthTokens' } } } }
  /auth/register:
    post:
      tags: [auth]
      summary: Zarejestruj konto mieszkańca
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Credentials' } } } }
      responses:
        '201': { description: Utworzono konto, content: { application/json: { schema: { $ref: '#/components/schemas/AuthTokens' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/register-organization:
    post:
      tags: [auth]
      summary: Zarejestruj konto organizacji (NGO, samorząd)
      description: |
        Tworzy użytkownika z rolą `org`, organizację o statusie `pending` i członkostwo właściciela.
        Do czasu weryfikacji przez administratora (`PATCH /admin/organizations/{id}`) organizacja widzi swój panel,
        ale nie może publikować inicjatyw, ankiet ani wydarzeń (`403`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationRegistration' }
      responses:
        '201': { description: Utworzono konto organizacji, content: { application/json: { schema: { $ref: '#/components/schemas/AuthTokens' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/login:
    post:
      tags: [auth]
      summary: Zaloguj się
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Credentials' } } } }
      responses:
        '200': { description: Zalogowano, content: { application/json: { schema: { $ref: '#/components/schemas/AuthTokens' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/refresh:
    post:
      tags: [auth]
      summary: Odśwież token dostępu
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [refresh], properties: { refresh: { type: string } } } } }
      responses:
        '200': { description: Nowy token dostępu, content: { application/json: { schema: { $ref: '#/components/schemas/AuthTokens' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/upgrade:
    post:
      tags: [auth]
      summary: Zamień konto gościa na pełne ("zapisz postęp")
      description: Zachowuje wszystkie głosy, kolekcję i XP gościa.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Credentials' } } } }
      responses:
        '200': { description: Konto zapisane, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /me:
    get:
      tags: [me]
      summary: Profil zalogowanego użytkownika
      responses:
        '200': { description: Profil, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/collection:
    get:
      tags: [me]
      summary: Kolekcja postaci ("Moje Spryciaki")
      responses:
        '200':
          description: Liczba posiadanych sztuk każdej postaci (klucz = kod postaci)
          content:
            application/json:
              schema: { type: object, additionalProperties: { type: integer, minimum: 0 }, example: { cyclist: 1, bin: 0, tree: 0, train: 0, lamp: 2 } }
  /me/pokemons:
    get:
      tags: [me]
      summary: Posiadane pokemony wraz z poziomem i mocą (zakładka "Pokemony")
      description: |
        W przeciwieństwie do `/me/collection` (tylko liczba sztuk per gatunek) zwraca każdy egzemplarz z osobna:
        do wyboru pokemona przy głosowaniu (`pokemonId`), zgłaszaniu (`stakedPokemonId`) i walce (`pokemonIds`).
      parameters:
        - { name: availableOnly, in: query, required: false, description: Tylko niezastawione (gotowe do walki), schema: { type: boolean, default: false } }
      responses:
        '200': { description: Lista posiadanych pokemonów, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Pokemon' } } } } }
  /me/progress:
    get:
      tags: [me]
      summary: Poziom i doświadczenie
      responses:
        '200': { description: Postęp gracza, content: { application/json: { schema: { $ref: '#/components/schemas/PlayerProgress' } } } }
  /me/interactions:
    get:
      tags: [me]
      summary: Inicjatywy, z którymi użytkownik miał styczność (zgłosił, zagłosował lub skomentował)
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { description: Strona wyników, content: { application/json: { schema: { $ref: '#/components/schemas/PokestopPage' } } } }
  /me/organization:
    get:
      tags: [me]
      summary: Organizacja zalogowanego użytkownika (rola `org`)
      responses:
        '200': { description: Organizacja, content: { application/json: { schema: { $ref: '#/components/schemas/Organization' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /catalog:
    get:
      tags: [scenarios]
      summary: Słownik postaci i typów
      description: |
        Dane statyczne (zmieniają się rzadko), więc klient może je buforować. Pozwalają wyświetlić nazwy, ikony
        i typy pokemonów bez zaszywania ich we frontendzie. Modele 3D nadal leżą we frontendzie (`modelPath`).
      security: []
      responses:
        '200': { description: Słowniki, content: { application/json: { schema: { $ref: '#/components/schemas/Catalog' } } } }
  /scenarios:
    get:
      tags: [scenarios]
      summary: Katalog scenariuszy dostępnych dla roli użytkownika
      description: Mieszkaniec dostaje scenariusze `resident`, organizacja `org`. Administrator wszystkie.
      parameters:
        - { name: category, in: query, required: false, schema: { $ref: '#/components/schemas/ScenarioCategory' } }
      responses:
        '200': { description: Scenariusze wraz z sekcjami i polami, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Scenario' } } } } }

  /pokestops:
    get:
      tags: [pokestops]
      summary: Pinezki w widocznym fragmencie mapy
      description: Odrzucone (`rejected`) są pomijane, chyba że zapyta administrator z `status=rejected`.
      parameters:
        - { name: bbox, in: query, required: false, description: 'minLng,minLat,maxLng,maxLat', schema: { type: string, example: '19.90,50.04,19.98,50.08' } }
        - { name: type, in: query, required: false, schema: { $ref: '#/components/schemas/PokestopType' } }
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/PokestopStatus' } }
        - { name: organizationId, in: query, required: false, schema: { type: integer } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { description: Strona pinezek, content: { application/json: { schema: { $ref: '#/components/schemas/PokestopPage' } } } }
    post:
      tags: [pokestops]
      summary: Dodaj pinezkę (zgłoszenie, pomysł, cool miejsce, inicjatywa organizacji)
      description: |
        Serwer ustala autora, status `open`, rodzaj pinezki (z scenariusza) i organizację (z członkostwa).
        `details` jest walidowane względem definicji scenariusza (pola wymagane, zakresy, warunki widoczności).
        Scenariusze `org` wymagają roli `org` i zweryfikowanej organizacji.

        Dla typu `report`/`idea` wymagane jest `stakedPokemonId` — jeden z własnych, niezastawionych pokemonów
        użytkownika. Serwer blokuje go do walki i ustala `character` na jego gatunek. Zastaw wraca do autora, gdy
        zgłoszenie osiągnie `votesRequired` głosów "za" albo zostanie rozwiązane (z premią exp), a także po odrzuceniu
        lub wycofaniu (bez premii) — patrz `docs/api-contract.md`.

        **Moderacja (tylko zgłoszenia mieszkańców):** przed zapisem agent AI ze zahardkodowanym promptem dostaje treść
        zgłoszenia i zwraca wyłącznie tak/nie. Nie (`422`, kod `moderation_rejected`): zgłoszenie nie powstaje i pokemon
        nie jest zastawiany. Agent nie podaje powodu, więc komunikat jest ogólny. Brak odpowiedzi w 5 s: `503` z kodem
        `moderation_unavailable`, zgłoszenie nie powstaje i można ponowić (treść niezweryfikowana nie trafia na mapę).
        Zgłoszenia zweryfikowanych organizacji nie przechodzą przez agenta. Każdy werdykt trafia do logu moderacji.

        Pinezki `ngo`/`consultation` mogą mieć ankietę (`questions`).

        Pinezkę (`lat`/`lng`) można postawić tylko w kółku interakcji gracza: dalej niż 50 m od `position`
        → `422` z kodem `too_far`, nic się nie zapisuje, a pokemon nie jest zastawiany.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NewPokestop' } } } }
      responses:
        '201': { description: Utworzono, content: { application/json: { schema: { $ref: '#/components/schemas/PokestopDetail' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 'Wskazany pokemon jest już zastawiony (`pokemon_unavailable`)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ValidationErrorOrTooFar' }
        '503': { description: 'Agent moderujący nie odpowiedział (`moderation_unavailable`), można ponowić', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /pokestops/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [pokestops]
      summary: Szczegóły pinezki wraz z komentarzami
      responses:
        '200': { description: Pinezka, content: { application/json: { schema: { $ref: '#/components/schemas/PokestopDetail' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [admin]
      summary: Zmień status pinezki (moderacja)
      description: |
        Tylko administrator. Zapisuje wpis w historii zmian statusu.
        `resolved` zwraca zastawionego pokemona autorowi z premią exp (jak osiągnięcie progu głosów),
        `rejected` zwraca go bez premii. `note` jest wymagane przy `rejected`.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StatusChange' } } } }
      responses:
        '200': { description: Zaktualizowana pinezka, content: { application/json: { schema: { $ref: '#/components/schemas/PokestopDetail' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /pokestops/{id}/vote:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [pokestops]
      summary: Zagłosuj za lub przeciw
      description: |
        Jeden głos na użytkownika, bez zmiany. `pokemonId` to jeden z własnych pokemonów głosującego — przy
        pierwszym głosie dostaje +10 exp (nie trzeba, by był dostępny/niezastawiony). Kolejna próba głosu na tę
        samą pinezkę zwraca `409` i exp się nie powtarza. Głosować można tylko w kółku interakcji: serwer porównuje `position` z położeniem pinezki (dziś do 50 m); dalej → `422` z kodem `too_far` (głos się nie zapisuje, exp nie jest przyznawany).
        Administrator nie głosuje (`403`), autor nie głosuje na własną
        pinezkę (`403`, kod `own_pokestop`). Gdy głos podniesie `votesFor` do progu `votesRequired`, serwer w tej samej
        transakcji zwraca autorowi zastawionego pokemona (`stakeReleasedAt` w odpowiedzi).
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [vote, pokemonId, position], properties: { vote: { $ref: '#/components/schemas/VoteValue' }, pokemonId: { type: integer, description: 'Pokemon głosującego, który dostanie exp' }, position: { $ref: '#/components/schemas/PositionRequest' } } } } }
      responses:
        '200': { description: Zapisano głos, content: { application/json: { schema: { $ref: '#/components/schemas/VoteResult' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/TooFar' }
  /pokestops/{id}/withdraw:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [pokestops]
      summary: Wycofaj własne zgłoszenie
      description: |
        Tylko autor i tylko typy `report`/`idea` w statusie `open` lub `in_progress`. Zgłoszenie dostaje status
        `rejected` (powód: wycofane przez autora), znika z mapy, a zastawiony pokemon wraca do autora **bez premii exp**.
        Bez tego zastawiony pokemon mógłby być zablokowany bezterminowo, gdy zgłoszenie nie zbierze głosów.
      responses:
        '200': { description: Wycofana pinezka, content: { application/json: { schema: { $ref: '#/components/schemas/PokestopDetail' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /pokestops/{id}/comments:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [pokestops]
      summary: Dyskusja pod pinezką (komentarze nadrzędne z odpowiedziami, stronicowane)
      description: |
        Strona dotyczy komentarzy nadrzędnych (najnowsze pierwsze); każdy ma wszystkie swoje odpowiedzi w `replies`
        (wątki mają jeden poziom). Ukryte przez moderatora komentarze są pomijane.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { description: Strona komentarzy, content: { application/json: { schema: { $ref: '#/components/schemas/CommentPage' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [pokestops]
      summary: Dodaj komentarz (lub odpowiedź na inny)
      description: 'Odpowiadać można tylko na komentarz nadrzędny tej samej pinezki (`parentCommentId`). Komentowanie nie wymaga bliskości.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 300 }
                parentCommentId: { type: integer, description: 'Id komentarza nadrzędnego tej samej pinezki' }
      responses:
        '201': { description: Dodany komentarz, content: { application/json: { schema: { $ref: '#/components/schemas/Comment' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /pokestops/{id}/survey-responses:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [pokestops]
      summary: Wypełnij ankietę przy pinezce
      description: |
        Dotyczy pinezek `ngo`/`consultation` z pytaniami (`questions`). Jedna odpowiedź na użytkownika (`409`, kod
        `already_answered`). Wypełniać można tylko w kółku interakcji (jak przy głosowaniu: `422` z kodem `too_far`).
        Odpowiedzi walidowane względem pytań (wymagane, typ, zakres, dozwolone opcje): błędy w `fields` pod kluczem
        pytania. Za wypełnioną ankietę serwer przyznaje **nowego pokemona** gatunku pinezki (`pokemon` w odpowiedzi).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SurveyResponseRequest' }
      responses:
        '201': { description: Ankieta zapisana, content: { application/json: { schema: { $ref: '#/components/schemas/SurveyResponseResult' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /pokestops/{id}/survey-results:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [pokestops]
      summary: Zbiorcze wyniki ankiety (autor-organizacja i administrator)
      description: 'To, co miasto lub organizacja zbierałaby w konsultacjach: liczba odpowiedzi i agregaty per pytanie. Teksty bez danych identyfikujących autorów.'
      responses:
        '200': { description: Wyniki, content: { application/json: { schema: { $ref: '#/components/schemas/SurveyResults' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /photos:
    post:
      tags: [pokestops]
      summary: Wgraj zdjęcie (przed utworzeniem zgłoszenia)
      description: Max 5 MB, tylko obrazy. Zwrócone `id` podaje się w `photoIds` przy tworzeniu pinezki (max 3). Niepodpięte zdjęcia są sprzątane po kilku godzinach.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } }
      responses:
        '201': { description: Zdjęcie wgrane, content: { application/json: { schema: { $ref: '#/components/schemas/Photo' } } } }
        '413': { description: Plik za duży, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /events:
    get:
      tags: [events]
      summary: Wydarzenia w widocznym fragmencie mapy
      parameters:
        - { name: bbox, in: query, required: false, description: 'minLng,minLat,maxLng,maxLat', schema: { type: string } }
        - { name: from, in: query, required: false, description: 'Początek okna czasu (domyślnie: teraz)', schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, description: 'Koniec okna czasu (domyślnie: +14 dni)', schema: { type: string, format: date-time } }
        - { name: organizationId, in: query, required: false, schema: { type: integer } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { description: Strona wydarzeń, content: { application/json: { schema: { $ref: '#/components/schemas/EventPage' } } } }
    post:
      tags: [events]
      summary: Dodaj wydarzenie (zweryfikowana organizacja)
      description: 'Rola `org` i organizacja `verified`. Nagrodą jest unikalny gatunek (`rewardCharacter` musi być oznaczony jako wyłączny dla wydarzeń). Treść organizacji nie przechodzi przez agenta moderującego.'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NewEvent' } } } }
      responses:
        '201': { description: Utworzono, content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /events/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [events]
      summary: Szczegóły wydarzenia
      responses:
        '200': { description: Wydarzenie, content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [events]
      summary: Odwołaj wydarzenie (organizacja-organizator lub administrator)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [cancelled] }
      responses:
        '200': { description: Zaktualizowane wydarzenie, content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /events/{id}/check-in:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [events]
      summary: Zamelduj się na wydarzeniu i odbierz unikalnego pokemona
      description: |
        Udział to obecność na miejscu w czasie trwania wydarzenia. Serwer sprawdza odległość (dziś do 50 m, `422`
        z kodem `too_far`), okno czasu (`409`, kod `outside_time_window`), limit miejsc (`409`, kod `capacity_reached`)
        i jednorazowość (`409`, kod `already_checked_in`). Nagroda: nowy pokemon gatunku `rewardCharacter`.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PositionRequest' } } } }
      responses:
        '200': { description: Zameldowano, content: { application/json: { schema: { $ref: '#/components/schemas/CheckInResult' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /organizations/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [organizations]
      summary: Publiczny profil organizacji (dla mieszkańców oglądających jej inicjatywy)
      description: 'Bez danych kontaktowych (`krs`, osoba, telefon, e-mail), te widzi tylko sama organizacja (`/me/organization`) i administrator.'
      responses:
        '200': { description: Profil, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationPublic' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /encounters:
    get:
      tags: [game]
      summary: Przeciwnicy w kółku interakcji gracza
      description: |
        Przeciwników generuje serwer, a klient tylko ich wyświetla — `power` i `typeCode` są widoczne z góry, żeby gracz
        mógł dobrać pokemony przed podejściem. Klient pyta z promieniem kółka interakcji (`radius=50`) po każdych ~10 m
        ruchu i co ~30 s na postoju.

        Przeciwnicy są **przypisani do miejsc**, nie do gracza: teren dzieli się na kwadraty 100 × 100 m, a każdy kwadrat
        przy pierwszym odwiedzeniu losuje 0–6 przeciwników, którzy stoją tam, dopóki nie zostaną pokonani albo nie wygasną
        (wspólni dla wszystkich graczy w okolicy). Wyczyszczony kwadrat zasiedla się na nowo po ~60 s. Odpowiedź zawiera
        najbliższych przeciwników w promieniu, **najwyżej 5** (może być pusta). Wartości (kwadrat, liczba, odnowienie)
        to konfiguracja backendu (`game.encounters`).
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, format: double } }
        - { name: lng, in: query, required: true, schema: { type: number, format: double } }
        - { name: radius, in: query, required: false, description: Promień w metrach (kółko interakcji), schema: { type: integer, default: 50, maximum: 500 } }
      responses:
        '200': { description: Aktywni przeciwnicy, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Encounter' } } } } }
  /encounters/{id}/attack:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [game]
      summary: Zaatakuj przeciwnika do 3 wybranymi pokemonami
      description: |
        Klient wysyła swoją pozycję i `pokemonIds` (1–3 własne, niezastawione pokemony). Serwer sprawdza odległość
        (dziś 50 m; za daleko → `too_far`, do walki nie dochodzi) i wiarygodność pozycji (dokładność, skoki, tempo
        ruchu), potem liczy moc każdego pokemona z jego aktualnego exp, mnoży razy 1.2 jeśli jego typ = typ
        przeciwnika, sumuje i porównuje z mocą przeciwnika. Suma większa → `won` (exp dla każdego użytego pokemona,
        nowa postać do kolekcji, XP gracza); suma mniejsza/równa → `lost` (próba zapisana, przeciwnik nadal aktywny,
        można próbować ponownie). Zapisuje każdą próbę i limituje częstotliwość. Zwycięstwo jest atomowe: tylko
        jeden gracz pokona danego przeciwnika.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AttackRequest' } } } }
      responses:
        '200': { description: Wynik walki, content: { application/json: { schema: { $ref: '#/components/schemas/AttackResult' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Przeciwnik pokonany lub wygasły, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Za dużo prób, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/organizations:
    get:
      tags: [admin]
      summary: Lista organizacji (do weryfikacji)
      parameters:
        - { name: verificationStatus, in: query, required: false, schema: { $ref: '#/components/schemas/VerificationStatus' } }
      responses:
        '200': { description: Organizacje, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Organization' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/organizations/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [admin]
      summary: Zweryfikuj lub zawieś organizację
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [verificationStatus], properties: { verificationStatus: { $ref: '#/components/schemas/VerificationStatus' } } } } }
      responses:
        '200': { description: Zaktualizowana organizacja, content: { application/json: { schema: { $ref: '#/components/schemas/Organization' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/scenarios/{code}:
    parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
    put:
      tags: [admin]
      summary: Zastąp definicję scenariusza (podnosi jego `version`)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Scenario' } } } }
      responses:
        '200': { description: Zapisany scenariusz, content: { application/json: { schema: { $ref: '#/components/schemas/Scenario' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer } }
    Page: { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }

  responses:
    Unauthorized: { description: Brak lub nieważny token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: Rola nie ma uprawnień do tej operacji, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Zasób nie istnieje, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: 'Konflikt stanu (np. głos już oddany, e-mail zajęty)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    TooFar: { description: 'Gracz stoi poza kółkiem interakcji (kod `too_far`)', content: { application/json: { schema: { $ref: '#/components/schemas/TooFarError' } } } }
    ValidationErrorOrTooFar:
      description: 'Błędne dane (`validation_error`), zgłoszenie odrzucone przez moderację (`moderation_rejected`) albo gracz poza kółkiem interakcji (`too_far`)'
      content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/Error' }, { $ref: '#/components/schemas/TooFarError' }] } } }
    ValidationError: { description: 'Błędne dane (`validation_error`) albo zgłoszenie odrzucone przez moderację (`moderation_rejected`)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: validation_error, description: 'Stabilny kod błędu, np. validation_error, moderation_rejected, moderation_unavailable, own_pokestop, pokemon_unavailable, already_voted, already_answered, already_checked_in, too_far, outside_time_window, capacity_reached, too_many_requests' }
        message: { type: string }
        fields:
          type: object
          description: Błędy per pole formularza (klucz = `key` pola scenariusza)
          additionalProperties: { type: string }
          example: { rating: To pole jest wymagane }

    # ---- enumy (zgodne z typami ENUM w bazie)
    Role: { type: string, enum: [resident, org, admin] }
    PokestopType: { type: string, enum: [report, idea, place, ngo, consultation] }
    PokestopStatus: { type: string, enum: [open, in_progress, resolved, rejected] }
    VoteValue: { type: string, enum: ['for', 'against'] }
    ScenarioCategory: { type: string, enum: [problem, initiative, place] }
    FieldType: { type: string, enum: [text, textarea, number, select, multiselect, boolean, tags, date, photos, character, choice, rating] }
    VerificationStatus: { type: string, enum: [pending, verified, suspended] }
    CharacterCode: { type: string, enum: [cyclist, bin, tree, train, lamp, festival], description: 'Kody postaci ze słownika `collection_character` (lista rośnie wraz z grą)' }
    TypeCode: { type: string, enum: [transport, clean, green, energy, air, infra], description: 'Typ postaci/przeciwnika do mnożnika w walce (słownik `collection_type`)' }
    Catalog:
      type: object
      required: [characters, types]
      properties:
        characters: { type: array, items: { $ref: '#/components/schemas/CatalogCharacter' } }
        types: { type: array, items: { $ref: '#/components/schemas/CatalogType' } }
    CatalogCharacter:
      type: object
      required: [code, label, emoji, categoryLabel, typeCode, isStarter]
      properties:
        code: { $ref: '#/components/schemas/CharacterCode' }
        label: { type: string }
        emoji: { type: string }
        categoryLabel: { type: string }
        typeCode: { $ref: '#/components/schemas/TypeCode' }
        modelPath: { type: string, nullable: true, description: 'Ścieżka modelu 3D we frontendzie; null = model budowany w kodzie' }
        isStarter: { type: boolean, description: Gatunek przyznawany na start konta }
    CatalogType:
      type: object
      required: [code, name, emoji]
      properties:
        code: { $ref: '#/components/schemas/TypeCode' }
        name: { type: string }
        emoji: { type: string }

    # ---- konta
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        displayName: { type: string, maxLength: 60 }
    AuthTokens:
      type: object
      required: [access, refresh]
      properties:
        access: { type: string }
        refresh: { type: string }
    Me:
      type: object
      required: [id, displayName, role, isGuest]
      properties:
        id: { type: integer }
        displayName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        isGuest: { type: boolean }
        organization: { allOf: [{ $ref: '#/components/schemas/Organization' }], nullable: true }
    Organization:
      type: object
      required: [id, name, kind, verificationStatus]
      properties:
        id: { type: integer }
        name: { type: string }
        kind: { type: string, enum: [ngo, foundation, association, city_office, district_council, municipality, other] }
        krs: { type: string, nullable: true }
        contactPerson: { type: string, nullable: true }
        contactEmail: { type: string, format: email, nullable: true }
        contactPhone: { type: string, nullable: true }
        verificationStatus: { $ref: '#/components/schemas/VerificationStatus' }

    # ---- scenariusze
    Scenario:
      type: object
      required: [code, audience, pokestopType, label, emoji, character, version, sections]
      properties:
        code: { type: string, example: org-bus-stop }
        audience: { type: string, enum: [resident, org] }
        category: { allOf: [{ $ref: '#/components/schemas/ScenarioCategory' }], nullable: true }
        pokestopType: { $ref: '#/components/schemas/PokestopType' }
        label: { type: string }
        description: { type: string }
        emoji: { type: string }
        character: { $ref: '#/components/schemas/CharacterCode' }
        defaultTitle: { type: string, nullable: true }
        version: { type: integer }
        sections: { type: array, items: { $ref: '#/components/schemas/ScenarioSection' } }
    ScenarioSection:
      type: object
      required: [title, fields]
      properties:
        title: { type: string }
        fields: { type: array, items: { $ref: '#/components/schemas/ScenarioField' } }
    ScenarioField:
      type: object
      required: [key, label, type]
      properties:
        key: { type: string, example: shelterSize }
        label: { type: string }
        type: { $ref: '#/components/schemas/FieldType' }
        required: { type: boolean, default: false }
        hint: { type: string, nullable: true }
        placeholder: { type: string, nullable: true }
        unit: { type: string, nullable: true }
        min: { type: number, nullable: true }
        max: { type: number, nullable: true }
        options:
          type: array
          items: { type: object, required: [value, label], properties: { value: { type: string }, label: { type: string } } }
        showIf:
          type: object
          nullable: true
          description: Pole widoczne (i walidowane) tylko, gdy pole `key` ma wartość `equals`
          required: [key, equals]
          properties:
            key: { type: string }
            equals: {}

    # ---- pinezki
    Photo:
      type: object
      required: [id, url]
      properties:
        id: { type: integer }
        url: { type: string, format: uri }
    Comment:
      type: object
      required: [id, author, text, mine]
      properties:
        id: { type: integer }
        parentCommentId: { type: integer, nullable: true, description: 'Id komentarza nadrzędnego (null dla nadrzędnych)' }
        author: { type: string }
        text: { type: string }
        mine: { type: boolean }
        createdAt: { type: string, format: date-time }
        replies:
          type: array
          description: 'Odpowiedzi (tylko w `GET .../comments`, jeden poziom)'
          items: { $ref: '#/components/schemas/Comment' }
    CommentPage:
      type: object
      required: [count, results]
      properties:
        count: { type: integer, description: 'Liczba komentarzy nadrzędnych' }
        results: { type: array, items: { $ref: '#/components/schemas/Comment' } }
    Pokestop:
      type: object
      required: [id, type, status, scenarioCode, character, icon, title, author, mine, lat, lng, votesFor, votesAgainst, myVote, commentCount, createdAt]
      properties:
        id: { type: integer }
        type: { $ref: '#/components/schemas/PokestopType' }
        status: { $ref: '#/components/schemas/PokestopStatus' }
        scenarioCode: { type: string }
        character: { $ref: '#/components/schemas/CharacterCode' }
        icon: { type: string, description: Emoji scenariusza }
        title: { type: string }
        description: { type: string }
        author: { type: string, description: Nazwa wyświetlana autora (dla organizacji jej nazwa) }
        mine: { type: boolean, description: Czy autorem jest zalogowany użytkownik }
        organization: { type: string, nullable: true }
        organizationId: { type: integer, nullable: true }
        photos: { type: array, items: { $ref: '#/components/schemas/Photo' } }
        details: { type: object, additionalProperties: true, description: Pola scenariusza (klucz = `key` pola) }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        votesFor: { type: integer }
        votesAgainst: { type: integer }
        votesRequired: { type: integer, description: 'Próg `votesFor`, przy którym zwraca się zastawiony pokemon (tylko `report`/`idea`)' }
        myVote: { allOf: [{ $ref: '#/components/schemas/VoteValue' }], nullable: true }
        stakedPokemonId: { type: integer, nullable: true, description: 'Pokemon zostawiony przez autora (tylko `report`/`idea`)' }
        stakeReleasedAt: { type: string, format: date-time, nullable: true, description: 'Kiedy pokemon wrócił do autora (próg głosów, rozwiązanie, odrzucenie lub wycofanie)' }
        commentCount: { type: integer }
        rejectionReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    PokestopDetail:
      allOf:
        - $ref: '#/components/schemas/Pokestop'
        - type: object
          properties:
            questions:
              type: array
              description: 'Pytania ankiety (tylko `ngo`/`consultation` z ankietą)'
              items: { $ref: '#/components/schemas/Question' }
            surveyAnswered: { type: boolean, description: 'Czy zalogowany użytkownik już wypełnił ankietę' }
    PokestopPage:
      type: object
      required: [count, results]
      properties:
        count: { type: integer }
        results: { type: array, items: { $ref: '#/components/schemas/Pokestop' } }
    TooFarError:
      type: object
      required: [code, message, distanceM, radiusM]
      properties:
        code: { type: string, enum: [too_far] }
        message: { type: string, example: 'Jesteś za daleko (112 m), podejdź na mniej niż 50 m' }
        distanceM: { type: integer, description: Odległość gracza od celu policzona przez serwer }
        radiusM: { type: integer, description: 'Promień kółka interakcji (dziś 50)', example: 50 }
    NewPokestop:
      type: object
      required: [scenarioCode, title, lat, lng, position]
      properties:
        scenarioCode: { type: string }
        title: { type: string, minLength: 3, maxLength: 80 }
        description: { type: string }
        character: { allOf: [{ $ref: '#/components/schemas/CharacterCode' }], nullable: true, description: 'Tylko dla `place`/`ngo`/`consultation`. Dla `report`/`idea` serwer go ustala z `stakedPokemonId`.' }
        stakedPokemonId: { type: integer, description: 'Wymagane dla `report`/`idea`: własny, niezastawiony pokemon zostawiany na zgłoszeniu (patrz `GET /me/pokemons`).' }
        lat: { type: number, format: double, description: 'Miejsce pinezki (musi leżeć w kółku interakcji gracza)' }
        lng: { type: number, format: double }
        position: { $ref: '#/components/schemas/PositionRequest' }
        photoIds: { type: array, maxItems: 3, items: { type: integer } }
        details: { type: object, additionalProperties: true }
        organizationId: { type: integer, description: 'Wymagane tylko, gdy użytkownik należy do kilku organizacji' }
        questions:
          type: array
          description: 'Ankieta (tylko `ngo`/`consultation`, tylko zweryfikowana organizacja)'
          maxItems: 20
          items: { $ref: '#/components/schemas/NewQuestion' }
    StatusChange:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/PokestopStatus' }
        note: { type: string, description: Powód (wymagany przy `rejected`) }
    VoteResult:
      type: object
      required: [stop, pokemon]
      properties:
        stop: { $ref: '#/components/schemas/PokestopDetail' }
        pokemon: { allOf: [{ $ref: '#/components/schemas/Pokemon' }], description: Pokemon nagrodzony za ten głos (po doliczeniu +10 exp) }

    # ---- kolekcja (posiadane pokemony)
    Pokemon:
      type: object
      required: [id, character, typeCode, level, exp, expIntoLevel, expForNextLevel, power, isStaked]
      properties:
        id: { type: integer }
        character: { $ref: '#/components/schemas/CharacterCode' }
        typeCode: { $ref: '#/components/schemas/TypeCode' }
        nickname: { type: string, nullable: true }
        level: { type: integer, description: Wyliczone przez serwer z `exp` (wzór może się zmieniać) }
        exp: { type: integer }
        expIntoLevel: { type: integer, description: 'Exp zdobyte w obecnym poziomie (do paska postępu, jak `PlayerProgress.xpIntoLevel`)' }
        expForNextLevel: { type: integer, description: Exp potrzebne do kolejnego poziomu }
        power: { type: integer, description: 'Aktualna moc do walki, wyliczona z `level`' }
        isStaked: { type: boolean, description: Zostawiony na własnym zgłoszeniu/pomyśle — niedostępny do walki }
        caughtAt: { type: string, format: date-time }

    # ---- gra
    Encounter:
      type: object
      required: [id, name, emoji, level, typeCode, power, actionLabel, xpReward, lat, lng, expiresAt]
      properties:
        id: { type: integer }
        name: { type: string }
        emoji: { type: string }
        level: { type: integer }
        typeCode: { $ref: '#/components/schemas/TypeCode' }
        power: { type: integer, description: 'Moc, którą muszą przewyższyć wybrane pokemony (po mnożniku typu)' }
        description: { type: string }
        actionLabel: { type: string, description: 'Co trzeba zrobić na miejscu, zanim można zaatakować' }
        xpReward: { type: integer, description: Exp dla każdego użytego pokemona po wygranej }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        expiresAt: { type: string, format: date-time }
    AttackRequest:
      type: object
      required: [lat, lng, pokemonIds]
      properties:
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        accuracyM: { type: number, description: Deklarowana dokładność GPS w metrach }
        clientTime: { type: string, format: date-time }
        pokemonIds: { type: array, minItems: 1, maxItems: 3, items: { type: integer }, description: 'Własne, niezastawione pokemony użyte w walce' }
    AttackResult:
      oneOf:
        - $ref: '#/components/schemas/AttackWon'
        - $ref: '#/components/schemas/AttackLost'
        - $ref: '#/components/schemas/AttackTooFar'
      discriminator:
        propertyName: outcome
        mapping: { won: '#/components/schemas/AttackWon', lost: '#/components/schemas/AttackLost', too_far: '#/components/schemas/AttackTooFar' }
    AttackPokemonResult:
      type: object
      required: [pokemonId, powerUsed, typeMultiplierApplied]
      properties:
        pokemonId: { type: integer }
        powerUsed: { type: integer, description: Moc tego pokemona przed mnożnikiem }
        typeMultiplierApplied: { type: number, description: '1.2, gdy typ pokemona = typ przeciwnika, inaczej 1.0' }
        expGained: { type: integer, description: Tylko gdy walka wygrana }
    AttackWon:
      type: object
      required: [outcome, enemyPower, pokemonPowerTotal, pokemons, xpGained, progress]
      properties:
        outcome: { type: string, enum: [won] }
        enemyPower: { type: integer }
        pokemonPowerTotal: { type: integer, description: Suma mocy użytych pokemonów (po mnożniku typu) }
        pokemons: { type: array, items: { $ref: '#/components/schemas/AttackPokemonResult' } }
        awardedCharacter: { allOf: [{ $ref: '#/components/schemas/CharacterCode' }], nullable: true, description: Nowa postać zdobyta za wygraną walkę }
        xpGained: { type: integer, description: XP gracza (niezależne od exp pokemonów) }
        progress: { $ref: '#/components/schemas/PlayerProgress' }
    AttackLost:
      type: object
      required: [outcome, enemyPower, pokemonPowerTotal, pokemons]
      properties:
        outcome: { type: string, enum: [lost] }
        enemyPower: { type: integer }
        pokemonPowerTotal: { type: integer, description: Suma mocy użytych pokemonów (po mnożniku typu) — nie wystarczyła }
        pokemons: { type: array, items: { $ref: '#/components/schemas/AttackPokemonResult' } }
    AttackTooFar:
      type: object
      required: [outcome, distanceM]
      properties:
        outcome: { type: string, enum: [too_far] }
        distanceM: { type: integer }
    PlayerProgress:
      type: object
      required: [level, xp, xpIntoLevel, xpForNextLevel]
      properties:
        level: { type: integer }
        xp: { type: integer }
        xpIntoLevel: { type: integer }
        xpForNextLevel: { type: integer }

    # ---- ankiety
    Question:
      type: object
      required: [id, key, label, type, required]
      properties:
        id: { type: integer }
        key: { type: string, description: 'Klucz odpowiedzi w `answers`' }
        label: { type: string }
        type: { type: string, enum: [text, textarea, number, select, multiselect, boolean, choice, rating] }
        required: { type: boolean }
        options:
          type: array
          items: { type: object, required: [value, label], properties: { value: { type: string }, label: { type: string } } }
        min: { type: number, nullable: true }
        max: { type: number, nullable: true }
    NewQuestion:
      type: object
      required: [key, label, type]
      properties:
        key: { type: string, maxLength: 40 }
        label: { type: string, maxLength: 300 }
        type: { type: string, enum: [text, textarea, number, select, multiselect, boolean, choice, rating] }
        required: { type: boolean, default: true }
        options:
          type: array
          description: 'Wymagane dla `select`/`multiselect`/`choice`'
          items: { type: object, required: [value, label], properties: { value: { type: string }, label: { type: string } } }
        min: { type: number, nullable: true }
        max: { type: number, nullable: true }
    PositionRequest:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        accuracyM: { type: number, description: 'Deklarowana dokładność GPS w metrach' }
    SurveyResponseRequest:
      allOf:
        - $ref: '#/components/schemas/PositionRequest'
        - type: object
          required: [answers]
          properties:
            answers:
              type: object
              description: 'Klucz pytania -> odpowiedź (tekst, liczba, wartość opcji, tablica opcji lub boolean)'
              additionalProperties: true
    SurveyResponseResult:
      type: object
      required: [stop, pokemon]
      properties:
        stop: { $ref: '#/components/schemas/PokestopDetail' }
        pokemon: { $ref: '#/components/schemas/Pokemon' }
    SurveyResults:
      type: object
      required: [responseCount, questions]
      properties:
        responseCount: { type: integer }
        questions:
          type: array
          items: { $ref: '#/components/schemas/QuestionResult' }
    QuestionResult:
      type: object
      required: [questionId, key, label, type, answered]
      properties:
        questionId: { type: integer }
        key: { type: string }
        label: { type: string }
        type: { type: string }
        answered: { type: integer, description: 'Ile osób odpowiedziało na to pytanie' }
        counts:
          type: object
          description: 'Liczność odpowiedzi per opcja / `true` / `false` (dla pytań z opcjami i boolean)'
          additionalProperties: { type: integer }
        average: { type: number, nullable: true, description: 'Średnia (dla `rating` i `number`)' }
        texts:
          type: array
          description: 'Do 50 najnowszych odpowiedzi tekstowych (dla `text`/`textarea`)'
          items: { type: string }

    # ---- wydarzenia
    Event:
      type: object
      required: [id, organization, title, lat, lng, startsAt, endsAt, rewardCharacter, status, participantCount, checkedIn]
      properties:
        id: { type: integer }
        organization: { type: string }
        organizationId: { type: integer }
        title: { type: string }
        description: { type: string }
        address: { type: string, nullable: true }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        rewardCharacter: { $ref: '#/components/schemas/CharacterCode' }
        capacity: { type: integer, nullable: true }
        ageMin: { type: integer, nullable: true }
        ageMax: { type: integer, nullable: true }
        status: { type: string, enum: [scheduled, cancelled] }
        participantCount: { type: integer }
        checkedIn: { type: boolean, description: 'Czy zalogowany użytkownik już się zameldował' }
    NewEvent:
      type: object
      required: [title, lat, lng, startsAt, endsAt, rewardCharacter]
      properties:
        title: { type: string, minLength: 3, maxLength: 100 }
        description: { type: string }
        address: { type: string, maxLength: 200 }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        rewardCharacter: { $ref: '#/components/schemas/CharacterCode' }
        capacity: { type: integer, minimum: 1 }
        ageMin: { type: integer }
        ageMax: { type: integer }
    EventPage:
      type: object
      required: [count, results]
      properties:
        count: { type: integer }
        results: { type: array, items: { $ref: '#/components/schemas/Event' } }
    CheckInResult:
      type: object
      required: [event, pokemon]
      properties:
        event: { $ref: '#/components/schemas/Event' }
        pokemon: { $ref: '#/components/schemas/Pokemon' }

    # ---- organizacje
    OrganizationRegistration:
      type: object
      required: [email, password, organization]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        displayName: { type: string, maxLength: 60 }
        organization:
          type: object
          required: [name, kind]
          properties:
            name: { type: string, maxLength: 150 }
            kind: { type: string, enum: [ngo, foundation, association, city_office, district_council, municipality, other] }
            krs: { type: string, nullable: true }
            contactPerson: { type: string, nullable: true }
            contactEmail: { type: string, format: email, nullable: true }
            contactPhone: { type: string, nullable: true }
    OrganizationPublic:
      type: object
      required: [id, name, kind, verified]
      properties:
        id: { type: integer }
        name: { type: string }
        kind: { type: string, enum: [ngo, foundation, association, city_office, district_council, municipality, other] }
        verified: { type: boolean }
