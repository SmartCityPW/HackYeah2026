# Uruchomienie: skopiuj .env.example do .env, uzupełnij sekrety, a potem `docker compose up --build`.
# Aplikacja: http://localhost:4200 (frontend, nginx), API: http://localhost:8000/api/v1 (backend, gunicorn).
# Wartości niesekretne (host i nazwa bazy, port aplikacji) pochodzą z backend/config/default.yaml.
# Domyślne wartości poniżej muszą się z nim zgadzać (pilnuje tego test tests/test_deployment_files.py).
services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_DB: ${DB_NAME:-smartcity}
      POSTGRES_USER: ${DB_USER:-smartcity}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Ustaw DB_PASSWORD w pliku .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-smartcity} -d ${DB_NAME:-smartcity}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.13}
    # Sekrety i APP_CONFIG_OVERRIDE (np. config/demo.yaml) pochodzą wyłącznie z .env. Nie przekazujemy ich przez
    # `environment: ${...}`, bo wtedy Compose podstawiłby zmienną z powłoki (np. po `source config/local.env`
    # w backend/ wskazałaby nieistniejący w obrazie config/local.yaml).
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"    # po prawej port z backend/config/default.yaml (server.port)
    volumes:
      - media:/app/data/media           # backend/config/default.yaml (storage.media_root)

  frontend:
    build:
      context: ./frontend
      args:
        NODE_VERSION: ${NODE_VERSION:-24}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-4200}:80"     # adres z backend/config/default.yaml (app.cors_allowed_origins) musi się zgadzać z portem
    volumes:
      # Konfiguracja aplikacji (adres backendu, api.mode.*): edytujesz plik na hoście i odświeżasz stronę, bez przebudowy obrazu.
      - ./frontend/public/config:/usr/share/nginx/html/config:ro

volumes:
  db-data:
  media:
